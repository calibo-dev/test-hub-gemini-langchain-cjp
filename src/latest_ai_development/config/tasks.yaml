research_task:
  description: >
    Conduct focused research on {topic} using the provided knowledge context
    and current year {current_year}. Identify the most relevant developments,
    findings, trends, and useful insights.

  expected_output: >
    Structured research notes with these sections:
    1. Topic Overview
    2. Key Findings
    3. Important Details
    4. Risks / Assumptions
    5. Suggested Report Outline

  agent: researcher

reporting_task:
  description: >
    Review the research notes for {topic} and transform them into a complete,
    polished markdown report that is clear, professional, and practical.

  expected_output: >
    A final markdown report containing:
    - Title
    - Executive Summary
    - Main Analysis
    - Key Findings / Insights
    - Risks / Limitations
    - Recommendations / Next Steps

    The output must be plain markdown and must not be wrapped in code fences.

  agent: reporting_analyst