default_provider: openai
default_model: gpt-4.1-mini

providers:

  openai:
    chat_model: gpt-4.1-mini
    temperature: 0.7
    max_tokens: 4000

  anthropicai:
    chat_model: claude-sonnet-4-6
    temperature: 0.7
    max_tokens: 4000

  geminiai:
    chat_model: gemini-2.5-flash
    temperature: 0.7
    max_tokens: 4000

  ollama:
    chat_model: llama3.2
    temperature: 0.7
